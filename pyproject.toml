[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wanda-jv"
version = "0.3.2"
description = "Phono-Semantic Intelligence Layer: open middleware between speech-to-text and LLMs for Indonesian-Javanese dialect speech"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-2.0" }
authors = [{ name = "Wanda contributors" }]
keywords = ["javanese", "indonesian", "speech", "asr", "low-resource", "dialect", "nlp"]
dependencies = []

[project.urls]
Homepage = "https://benisobahasa.github.io/wanda/"
Repository = "https://github.com/benisobahasa/wanda"

[project.scripts]
wanda = "wanda.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wanda = ["data/*.tsv", "data/*.txt"]

[project.optional-dependencies]
api = ["fastapi", "uvicorn"]
asr = ["faster-whisper"]
semantic = ["sentence-transformers"]
